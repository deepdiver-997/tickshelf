# 分片异步持久化引擎示例（ADR-023）。默认路径不受影响：只有显式
# engine = true 才启用；--persist sqlite 表示写穿，none 表示仅发布。
[redis]
host = 127.0.0.1
port = 6379

[storage]
# 相对配置文件目录；四服务共用同一 db + shards 布局。
db = ../ticks.db
shards = 4

[tickshelfd]
bind = 127.0.0.1
port = 9900
persist = sqlite
engine = true
engine_batch_records = 8192
engine_batch_bytes = 4194304
engine_batch_ms = 100
engine_inflight = 8
engine_dedup = false
engine_dedup_bytes = 268435456
engine_retry_ms = 50
engine_max_pending_records = 65536
engine_lease_ttl_s = 60
engine_shutdown_ms = 10000

[persister]
worker = persister
poll_ms = 1000
once = false

[evictor]
soft_watermark_bytes = 536870912
emergency_watermark_bytes = 0
sample_ms = 1000
bytes_per_tick = 0
growth_tolerance_pct = 50
inflight = false

[queryd]
bind = 127.0.0.1
port = 9910
