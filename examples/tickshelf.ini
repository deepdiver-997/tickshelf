# tickshelf startup configuration (small INI dialect, NOT TOML).
# Load explicitly with --config PATH. CLI overrides file values.
# See docs/configuration.md for syntax, validation and --print-config.

[redis]
host = "127.0.0.1"
port = 6379

[storage]
# Relative to THIS file's directory, not the process working directory.
db = "../ticks.db"
shards = 1

[tickshelfd]
bind = "127.0.0.1"
port = 9900
flush_interval_ms = 500
persist = "sqlite"  # Explicit write-through; the no-config default remains none.

[persister]
worker = "persister"  # Runtime worker ID is this prefix followed by -PID.
poll_ms = 1000
once = false

[evictor]
# Example only: size this for your Redis memory budget before starting.
soft_watermark_bytes = 268435456  # 256 MiB; required when this section is present.
emergency_watermark_bytes = 0   # 0 disables tier3 (pending-data loss).
sample_ms = 1000
bytes_per_tick = 0              # 0 disables memory-growth reconciliation.
growth_tolerance_pct = 50.0
inflight = false                # Keep tier2 off unless deliberately enabled.

[queryd]
bind = "127.0.0.1"
port = 9910
